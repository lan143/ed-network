<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ed-network UI demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f6f8;
        color: #1f2430;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1.5rem;
      }
      h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b7280;
        margin: 0 0 0.5rem;
      }
      section {
        margin-bottom: 2rem;
      }
      /* Theming is per-host via CSS custom properties; no global component CSS. */
      .themed {
        --edn-accent: #7c3aed;
        --edn-danger: #db2777;
        --edn-muted: #64748b;
      }
    </style>
  </head>
  <body>
    <h1>ed-network UI demo</h1>
    <section>
      <h2>Composite &lt;edn-network-page&gt;</h2>
      <div id="page"></div>
    </section>
    <section class="themed">
      <h2>Standalone &lt;edn-network-settings&gt; (themed)</h2>
      <div id="settings"></div>
    </section>
    <section>
      <h2>Standalone &lt;edn-network-status&gt;</h2>
      <div id="status"></div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
